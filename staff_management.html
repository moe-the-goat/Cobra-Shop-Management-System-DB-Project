<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Sales Management - Cobra Shop</title>
    <link rel="stylesheet" href="staff_management.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="page-title">
                    <i class="fas fa-users-cog"></i>
                    Staff Sales Management
                </h1>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="window.location.href='index.html'">
                        <i class="fas fa-home"></i>
                        Back to Store
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Staff Selection Section -->
            <section class="staff-selection-section">
                <div class="section-header">
                    <h2>Select Staff Member</h2>
                    <p>Choose a staff member to view their assigned sales orders</p>
                </div>
                
                <div class="staff-grid" id="staffGrid">
                    <!-- Staff cards will be populated by JavaScript -->
                </div>
            </section>

            <!-- Sales Orders Section -->
            <section class="sales-orders-section" id="salesOrdersSection" style="display: none;">
                <div class="section-header">
                    <h2>Sales Orders</h2>
                    <div class="staff-info" id="selectedStaffInfo">
                        <!-- Selected staff info will be displayed here -->
                    </div>
                </div>

                <div class="orders-container">
                    <div class="orders-header">
                        <div class="orders-stats" id="ordersStats">
                            <!-- Order statistics will be displayed here -->
                        </div>
                        <div class="orders-filters">
                            <select id="statusFilter" class="filter-select">
                                <option value="">All Statuses</option>
                                <option value="Pending">Pending</option>
                                <option value="Processing">Processing</option>
                                <option value="Shipped">Shipped</option>
                                <option value="Delivered">Delivered</option>
                                <option value="Cancelled">Cancelled</option>
                                <option value="Returned">Returned</option>
                            </select>
                        </div>
                    </div>

                    <div class="orders-table-container">
                        <table class="orders-table" id="ordersTable">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Order Date</th>
                                    <th>Total Amount</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="ordersTableBody">
                                <!-- Orders will be populated by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Status Update Modal -->
    <div class="modal" id="statusModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Update Order Status</h3>
                <button class="modal-close" onclick="closeStatusModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="newStatus">New Status:</label>
                    <select id="newStatus" class="form-control">
                        <option value="Pending">Pending</option>
                        <option value="Processing">Processing</option>
                        <option value="Shipped">Shipped</option>
                        <option value="Delivered">Delivered</option>
                        <option value="Cancelled">Cancelled</option>
                        <option value="Returned">Returned</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="statusNote">Note (optional):</label>
                    <textarea id="statusNote" class="form-control" rows="3" placeholder="Add a note about this status change..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="staffManagement.closeStatusModal()">Cancel</button>
                <button class="btn btn-primary" onclick="staffManagement.updateOrderStatus()">Update Status</button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading...</p>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="staff_management.js"></script>
</body>
</html>
