<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Cobra Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/product_detail.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="../../index.html">
                <i class="fas fa-crown text-warning"></i> Cobra Shop
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../../index.html"><i class="fas fa-home"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html"><i class="fas fa-shopping-cart"></i> Cart</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html"><i class="fas fa-user"></i> Profile</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Loading State -->
    <div id="loadingState" class="loading-container">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container py-5 d-none" id="mainContent">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="../../index.html">Home</a></li>
                <li class="breadcrumb-item"><a href="../../index.html" id="categoryLink">Category</a></li>
                <li class="breadcrumb-item active" id="productBreadcrumb">Product</li>
            </ol>
        </nav>

        <!-- Product Details Section -->
        <section class="product-detail-section">
            <div class="row">
                <!-- Product Image -->
                <div class="col-lg-5 mb-4">
                    <div class="product-image-container">
                        <img id="productImage" src="" alt="Product Image" class="main-product-image">
                    </div>
                </div>

                <!-- Product Info -->
                <div class="col-lg-7">
                    <div class="product-info">
                        <h1 id="productName" class="product-title"></h1>
                        
                        <!-- Rating Summary -->
                        <div class="rating-summary mb-3">
                            <div class="stars" id="productStars"></div>
                            <span class="rating-value" id="ratingValue"></span>
                            <span class="review-count">(<span id="reviewCount"></span> reviews)</span>
                        </div>

                        <div class="product-price mb-3" id="productPrice"></div>
                        
                        <p class="product-description" id="productDescription"></p>

                        <div class="stock-status mb-4" id="stockStatus"></div>

                        <!-- Quantity & Add to Cart -->
                        <div class="purchase-section">
                            <div class="quantity-selector">
                                <button class="qty-btn minus" id="decreaseQty">-</button>
                                <input type="number" id="quantity" value="1" min="1" max="99">
                                <button class="qty-btn plus" id="increaseQty">+</button>
                            </div>
                            <button class="btn btn-primary btn-lg add-to-cart-btn" id="addToCartBtn">
                                <i class="fas fa-shopping-cart"></i> Add to Cart
                            </button>
                        </div>

                        <!-- Product Meta -->
                        <div class="product-meta mt-4">
                            <p><strong>Category:</strong> <span id="productCategory"></span></p>
                            <p><strong>SKU:</strong> <span id="productSku"></span></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Reviews Section -->
        <section class="reviews-section mt-5">
            <h2 class="section-title"><i class="fas fa-star"></i> Customer Reviews</h2>

            <div class="row">
                <!-- Rating Overview -->
                <div class="col-lg-4 mb-4">
                    <div class="rating-overview-card">
                        <div class="overall-rating">
                            <span class="big-rating" id="overallRating">0.0</span>
                            <div class="stars-large" id="overallStars"></div>
                            <p class="total-reviews">Based on <span id="totalReviews">0</span> reviews</p>
                        </div>
                        
                        <div class="rating-bars" id="ratingBars">
                            <!-- Rating distribution bars -->
                        </div>

                        <button class="btn btn-primary w-100 mt-3" id="writeReviewBtn" data-bs-toggle="modal" data-bs-target="#reviewModal">
                            <i class="fas fa-pen"></i> Write a Review
                        </button>
                    </div>
                </div>

                <!-- Reviews List -->
                <div class="col-lg-8">
                    <div class="reviews-controls mb-3">
                        <select class="form-select form-select-sm" id="sortReviews" style="width: auto;">
                            <option value="newest">Most Recent</option>
                            <option value="oldest">Oldest First</option>
                            <option value="highest">Highest Rated</option>
                            <option value="lowest">Lowest Rated</option>
                            <option value="helpful">Most Helpful</option>
                        </select>
                    </div>

                    <div class="reviews-list" id="reviewsList">
                        <!-- Reviews populated by JS -->
                    </div>

                    <!-- Pagination -->
                    <div class="reviews-pagination mt-4" id="reviewsPagination">
                        <!-- Pagination populated by JS -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Review Modal -->
    <div class="modal fade" id="reviewModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Write a Review</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="reviewForm">
                        <div class="mb-3">
                            <label class="form-label">Your Rating *</label>
                            <div class="star-rating-input">
                                <input type="radio" name="rating" value="5" id="star5">
                                <label for="star5"><i class="fas fa-star"></i></label>
                                <input type="radio" name="rating" value="4" id="star4">
                                <label for="star4"><i class="fas fa-star"></i></label>
                                <input type="radio" name="rating" value="3" id="star3">
                                <label for="star3"><i class="fas fa-star"></i></label>
                                <input type="radio" name="rating" value="2" id="star2">
                                <label for="star2"><i class="fas fa-star"></i></label>
                                <input type="radio" name="rating" value="1" id="star1">
                                <label for="star1"><i class="fas fa-star"></i></label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="reviewTitle" class="form-label">Review Title</label>
                            <input type="text" class="form-control" id="reviewTitle" maxlength="100" placeholder="Summarize your experience">
                        </div>
                        <div class="mb-3">
                            <label for="reviewText" class="form-label">Your Review</label>
                            <textarea class="form-control" id="reviewText" rows="4" maxlength="5000" placeholder="Share your thoughts about this product..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="submitReviewBtn">
                        <i class="fas fa-paper-plane"></i> Submit Review
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2024 Cobra Shop. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- UI Enhancement modules -->
    <script src="../../assets/js/toast.js"></script>
    <script src="../../assets/js/loading.js"></script>
    <script src="../../assets/js/a11y.js"></script>
    <script src="../../assets/js/product_detail.js"></script>
</body>
</html>
